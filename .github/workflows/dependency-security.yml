name: Dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install runtime deps, optional crypto, and pip-audit
        # Install declared deps without the local package: new alphas are not
        # on PyPI until after the release tag publish, and --strict fails then.
        run: |
          python <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(data["project"]["dependencies"])
          deps.extend(data["project"]["optional-dependencies"]["crypto"])
          Path("/tmp/deps.txt").write_text("\n".join(deps) + "\n", encoding="utf-8")
          PY
          pip install -r /tmp/deps.txt pip-audit

      - name: Audit installed dependencies
        run: pip-audit --desc --strict
