[project]
name = "pybravia-connect"
dynamic = ["version"]
description = "HA-agnostic Sony BRAVIA Connect ControlDeviceService client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "steamEngineer" }]
keywords = [
    "bravia",
    "sony",
    "grpc",
    "theatre",
    "home-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.76.0",
    "protobuf>=5,<8",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "cryptography>=42",
    "build>=1.2",
    "twine>=6.0",
    "pre-commit>=4.0",
    "types-protobuf>=5.0",
]

[project.urls]
Homepage = "https://github.com/steamEngineer/pybravia-connect"
Repository = "https://github.com/steamEngineer/pybravia-connect"
Issues = "https://github.com/steamEngineer/pybravia-connect/issues"
Changelog = "https://github.com/steamEngineer/pybravia-connect/blob/main/CHANGELOG.md"

[project.scripts]
bravia-connect-keys = "pybravia_connect.cli.get_session_keys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pybravia_connect/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pybravia_connect"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "src/pybravia_connect/proto/bravia_control_pb2.py",
    "src/pybravia_connect/proto/bravia_control_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pybravia_connect"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "src/pybravia_connect/proto/bravia_control_pb2\\.py",
    "src/pybravia_connect/proto/bravia_control_pb2_grpc\\.py",
]

[[tool.mypy.overrides]]
module = "pybravia_connect.proto.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--cov=pybravia_connect",
    "--cov-report=term-missing",
]
markers = [
    "live: live device smoke tests (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
source = ["pybravia_connect"]
omit = [
    "*/proto/bravia_control_pb2.py",
    "*/proto/bravia_control_pb2_grpc.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
